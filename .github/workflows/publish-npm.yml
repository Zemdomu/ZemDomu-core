name: Publish npm package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use an npm CLI with trusted-publishing support
        run: npm install -g "npm@^11.5.1"
      - name: Validate, build, and publish the public source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          REPOSITORY=$(node -p "require('./package.json').repository.url")
          test "$REPOSITORY" = "git+https://github.com/Zemdomu/ZemDomu-core.git" || { echo "package repository does not match the trusted publisher repository."; exit 1; }
          if npm view "zemdomu@$VERSION" version >/dev/null 2>&1; then
            echo "zemdomu@$VERSION already exists; keeping the immutable registry artifact."
            exit 0
          fi
          npm run audit:production
          npm run audit:all
          npm ci
          npm test
          npm run build
          npm publish --access public --provenance
