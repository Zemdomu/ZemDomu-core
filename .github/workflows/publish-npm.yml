name: Publish npm package

on:
  repository_dispatch:
    types: [zemdomu-release]
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact public main commit approved for publication
        required: true
        type: string
      expected_version:
        description: Exact reviewed package version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Zemdomu/ZemDomu-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # This exact distribution includes npm 11.19.1 with OIDC publishing support.
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate, build, and publish the public source
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.event.client_payload.sha || inputs.expected_commit }}
          EXPECTED_VERSION: ${{ github.event.client_payload.version || inputs.expected_version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "An exact public commit is required."; exit 1; }
          [[ "$EXPECTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "A stable package version is required."; exit 1; }
          test "$GITHUB_REF_NAME" = "main" || { echo "Publication must run from public main."; exit 1; }
          test "$GITHUB_SHA" = "$EXPECTED_COMMIT" || { echo "Public main changed after release approval; reconcile before publication."; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT" || { echo "Checkout does not match the reviewed public commit."; exit 1; }
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_COMMIT" || { echo "Public main moved during publication setup."; exit 1; }
          VERSION=$(node -p "require('./package.json').version")
          test "$VERSION" = "$EXPECTED_VERSION" || { echo "Package version does not match release approval."; exit 1; }
          REPOSITORY=$(node -p "require('./package.json').repository.url")
          test "$REPOSITORY" = "git+https://github.com/Zemdomu/ZemDomu-core.git" || { echo "package repository does not match the trusted publisher repository."; exit 1; }
          if npm view "zemdomu@$VERSION" version >/dev/null 2>&1; then
            echo "zemdomu@$VERSION already exists; keeping the immutable registry artifact."
            exit 0
          fi
          npm run audit:production
          npm run audit:all
          npm ci
          npm test
          npm run build
          npm publish --access public --provenance
